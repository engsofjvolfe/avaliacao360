<!--
  SidebarEstilos.html
  ---------------------------------------------------------------------------
  CSS específico da Barra Lateral (o que não é compartilhado com o Painel —
  ver EstilosComuns.html para cores/fonte/formato básico de cartão).
  ---------------------------------------------------------------------------
-->
<style>
  .app-bar {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    padding: 18px 16px 16px 16px;
  }
  .app-bar h1 { font-size: 16px; font-weight: 700; margin: 0 0 2px 0; }
  .app-bar p { font-size: 11.5px; margin: 0; opacity: 0.85; font-weight: 400; }

  .content { padding: 14px; display: flex; flex-direction: column; gap: 14px; }

  /* Sombra/espaçamento um pouco mais suaves que o padrão comum, específicos da barra lateral */
  .card {
    box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.06);
    padding: 14px;
  }
  .card h2 {
    font-size: 12.5px;
    font-weight: 700;
    margin: 0 0 10px 0;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    margin: 8px 0 4px 0;
  }
  select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--divider);
    background: var(--bg);
    font-family: inherit;
    font-size: 12.5px;
    color: var(--text-primary);
  }
  select:focus { outline: none; border-color: var(--primary); }

  button {
    font-family: inherit;
    font-weight: 500;
    font-size: 12.5px;
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    cursor: pointer;
    transition: box-shadow 0.15s, transform 0.05s, background 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
  }
  button:active { transform: scale(0.98); }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 1px 3px rgba(87,70,227,0.4); margin-top: 10px; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--primary-light); color: var(--primary-dark); margin-top: 10px; }
  .btn-secondary:hover { background: #E0DCF9; }
  button:disabled { opacity: 0.55; cursor: default; }

  .spinner {
    width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,0.5);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .spinner.on { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-msg {
    margin-top: 10px;
    font-size: 11.5px;
    line-height: 1.5;
    border-radius: 6px;
    padding: 8px 10px;
    display: none;
  }
  .status-msg.on { display: block; }
  .status-ok { background: #E8F5E9; color: #2E7D32; }
  .status-warn { background: #FFF8E1; color: #8D6E00; }
  .status-error { background: #FFEBEE; color: #C62828; }
  .status-msg ul { margin: 6px 0 0 0; padding-left: 16px; }

  .stat-card { margin-top: 10px; }
  .stat-card.oculto { display: none; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--divider); }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: var(--text-secondary); font-size: 11.5px; }
  .stat-value { font-weight: 700; font-size: 13px; color: var(--primary-dark); }

  .chip {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 20px;
  }
  .chip-ativo { background: #E8F5E9; color: #2E7D32; }
  .chip-inativo { background: #EEEEEE; color: #616161; }

  .footer {
    text-align: center;
    font-size: 10.5px;
    color: var(--text-secondary);
    padding: 4px 14px 14px 14px;
  }
  .kicker { font-size: 10.5px; color: var(--text-secondary); margin-top: -4px; }
</style>
